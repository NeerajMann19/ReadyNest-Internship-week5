# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = backend/alembic

# sys.path path, aligned with the ini file location
prepend_sys_path = backend

sqlalchemy.url = postgresql+asyncpg://postgres:admin123@localhost:5432/prismiq

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
